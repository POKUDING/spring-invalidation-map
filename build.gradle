subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    // group id 는 Maven Central 의 네임스페이스 소유 증명 방식 때문에 io.github.<GitHub 계정>
    // 을 씁니다. dev.toktokhan.* 로 올리려면 toktokhan.dev 도메인의 DNS TXT 레코드로 소유를
    // 증명해야 하는데, 이 저장소는 개인 계정에 있어 조직 도메인 협조가 필요합니다.
    // io.github.<계정> 은 GitHub 계정 소유만으로 증명되므로 이 배포 경로와 맞습니다.
    group = 'io.github.pokuding'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }

    // 툴체인 대신 release 를 씁니다.
    // Spring Boot 4 의 기준선이 Java 17 이고, Java 17 바이트코드는 JVM 17 과 21 에서 모두 돕니다.
    // 이 장비의 기본 JVM 은 JDK 21 이므로 툴체인으로 17 을 요구하면 JDK 17 설치가 필요해집니다.
    // release = 17 이면 JDK 21 이 Java 17 바이트코드(클래스 파일 버전 61)를 만들고,
    // Java 18 이상에서 추가된 API 를 실수로 쓰면 컴파일 단계에서 걸립니다.
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }

    // Maven Central 은 sources jar 와 javadoc jar 를 요구합니다.
    java {
        withSourcesJar()
        withJavadocJar()
    }

    // javadoc 이 한국어이므로 인코딩을 명시합니다. 지정하지 않으면 플랫폼 기본 인코딩을
    // 쓰다가 UTF-8 이 아닌 환경에서 깨집니다.
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('charset', 'UTF-8')
        options.addStringOption('docencoding', 'UTF-8')
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.assertj:assertj-core:3.26.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
        testLogging {
            events 'failed'
            exceptionFormat 'full'
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java

                pom {
                    name = project.name
                    description = project.provider { project.description }
                    url = 'https://github.com/POKUDING/spring-invalidation-map'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'pokuding'
                            name = 'poku'
                            url = 'https://github.com/POKUDING'
                        }
                    }

                    scm {
                        connection = 'scm:git:https://github.com/POKUDING/spring-invalidation-map.git'
                        developerConnection = 'scm:git:ssh://git@github.com/POKUDING/spring-invalidation-map.git'
                        url = 'https://github.com/POKUDING/spring-invalidation-map'
                    }
                }
            }
        }
    }

    // 서명 키가 있을 때만 서명합니다. Maven Central 업로드에는 서명이 필수지만,
    // 로컬에서 publishToMavenLocal 로 확인할 때는 키 없이 돌아야 합니다.
    // 키는 gradle.properties 나 환경 변수(ORG_GRADLE_PROJECT_signingKey,
    // ORG_GRADLE_PROJECT_signingPassword)로 넣습니다.
    signing {
        def signingKey = findProperty('signingKey')
        def signingPassword = findProperty('signingPassword')
        if (signingKey) {
            useInMemoryPgpKeys(signingKey as String, signingPassword as String)
            sign publishing.publications.maven
        }
    }
}
